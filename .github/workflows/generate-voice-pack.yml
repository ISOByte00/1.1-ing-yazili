name: Generate fixed vocabulary MP3 pack

# Manual, one-time generation only. No cron, PR or push trigger.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-fixed-vocabulary-audio
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'ISOByte00/1.1-ing-yazili'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate missing MP3 only
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: node scripts/generate-audio.mjs
      - name: Commit finished audio pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/core/ audio/manifest.json
          if git diff --cached --quiet; then
            echo 'All recordings already committed; no API work needed.'
          else
            git commit -m 'Add prerecorded English and Turkish vocabulary voices'
            git push origin HEAD:main
          fi